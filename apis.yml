name: lovecrafts
description: >-
  LoveCrafts (LoveCrafts Group Limited) is a UK-based crafting commerce and
  community platform — "your home to shop, share and dream in crafts" — selling
  yarns and fibers, knitting, crochet, sewing, quilting and embroidery patterns,
  supplies, tools, kits and fabrics, alongside free and paid patterns, tutorials
  and inspiration content. It operates localized storefronts for North America,
  the UK, Germany, Australia and France on a Nuxt-based e-commerce stack. LoveCrafts
  was surfaced as a portfolio company of Balderton Capital and added to the API
  Evangelist network. It exposes no public developer portal or API surface; the only
  machine-discoverable public artifact is an RFC 9116 security.txt with a responsible-
  disclosure policy (no bug bounty programme).
